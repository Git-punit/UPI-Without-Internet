spring.application.name=upi-offline-backend
# Runs schema.sql on every start (it uses IF NOT EXISTS). Default DB is in-memory H2;
# for PostgreSQL set SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
spring.sql.init.mode=always

# Longest validity window a sender may sign. Expiry is checked against server time at submission.
upi.max-ttl=PT24H
# Mock balance every newly registered user starts with (minor units: 100000 = Rs 1000.00).
upi.mock.starting-balance-minor=100000

# Our error messages are safe to show and the app displays them.
server.error.include-message=always

# Backend private key, created on first start. Keep it out of Git and back it up: losing it makes
# every packet sealed offline with the old public key unreadable.
upi.key-file=${UPI_KEY_FILE:data/backend-key.der}

# 8080 is often taken by another local app; override with PORT.
server.port=${PORT:8081}

# Real UPI via Razorpay (test mode). Leave unset to run without it; the wallet endpoints then answer 503.
# Never put these values in this file: set them as environment variables.
upi.razorpay.base-url=https://api.razorpay.com
upi.razorpay.key-id=${RAZORPAY_KEY_ID:}
upi.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
upi.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
# RazorpayX account number that payouts (withdrawals to a UPI ID) are paid from.
upi.razorpay.payout-account=${RAZORPAYX_ACCOUNT_NUMBER:}

# Always revalidate the dashboard files, so a rebuilt backend never shows a stale page.
spring.web.resources.cache.cachecontrol.no-cache=true
